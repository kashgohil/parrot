# Cleanup LLM sidecar — a standalone binary that links ONLY llama.cpp (no
# whisper-rs), so its ggml has no duplicate-symbol collision with the STT engine.
# The main app spawns this and talks to it over stdin/stdout JSON.
[package]
name = "parrot-cleanup-sidecar"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "cleanup-sidecar"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
encoding_rs = "0.8"

# Metal offload on macOS (matches the previous in-process config).
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", features = ["metal"] }
