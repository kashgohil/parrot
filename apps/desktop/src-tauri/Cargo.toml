[package]
name = "parrot"
version = "0.2.1"
description = "Voice dictation app"
authors = ["you"]
edition = "2021"

[lib]
name = "parrot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
enigo = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
arboard = "3"
whisper-rs = { version = "0.14", features = ["metal"] }
# Parakeet (and other ONNX ASR) — same library Handy uses (MIT).
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx"] }
# In-process LLM cleanup (replaces Ollama for new installs).
llama-cpp-2 = "0.1"
encoding_rs = "0.8"
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# CoreML EP for ONNX Parakeet on Apple Silicon (~Neural Engine).
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx", "ort-coreml"] }
# Metal offload for in-process llama.cpp cleanup.
llama-cpp-2 = { version = "0.1", features = ["metal"] }
