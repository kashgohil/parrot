# The cleanup LLM (llama.cpp) lives in a SEPARATE binary (cleanup-sidecar) so it
# no longer statically links its own ggml into the same process as whisper-rs.
# Two ggml copies in one binary collide at link time (duplicate symbols) and
# llama ends up running on whisper's ggml — the root cause of the cleanup crash.
# Isolating llama in its own process eliminates the collision by construction.
[workspace]
members = ["cleanup-sidecar"]
resolver = "2"

[package]
name = "parrot"
version = "0.2.3"
description = "Voice dictation app"
authors = ["you"]
edition = "2021"

[lib]
name = "parrot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
enigo = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
arboard = "3"
whisper-rs = { version = "0.14", features = ["metal"] }
# Parakeet (and other ONNX ASR) — same library Handy uses (MIT).
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx"] }
# LLM cleanup runs out-of-process in the `cleanup-sidecar` binary (see the
# [workspace] note above) — llama-cpp-2 is intentionally NOT a dependency of the
# main app so its ggml can't collide with whisper-rs's.
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# CoreML EP for ONNX Parakeet on Apple Silicon (~Neural Engine).
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx", "ort-coreml"] }
