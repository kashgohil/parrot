			// Pre-load the parrot icon as a data URL so html-to-image never has to
			// fetch it (avoids CORS / inline-fetch issues during capture).
			const ICON_URL = "../parrot.png";
			let ICON_DATA_URL = "";

			async function preloadIcon() {
				try {
					const res = await fetch(ICON_URL);
					if (!res.ok) {
						throw new Error(`HTTP ${res.status} fetching ${ICON_URL}`);
					}
					const blob = await res.blob();
					ICON_DATA_URL = await new Promise((resolve, reject) => {
						const reader = new FileReader();
						reader.onload = () => resolve(String(reader.result));
						reader.onerror = reject;
						reader.readAsDataURL(blob);
					});
					console.log(
						`[og-templates] icon preloaded as data URL (${ICON_DATA_URL.length} bytes)`,
					);
				} catch (err) {
					console.error(
						"[og-templates] preloadIcon failed — will fall back to direct path",
						err,
					);
				}
			}

			// ------------------------------------------------------------
			// Decorative waveform SVG — abstract sound bars in parakeet greens
			// ------------------------------------------------------------
			function waveformSVG() {
				const bars = [];
				const config = [
					[0, 90],
					[1, 140],
					[2, 70],
					[3, 200],
					[4, 110],
					[5, 250],
					[6, 80],
					[7, 170],
					[8, 130],
					[9, 220],
					[10, 60],
					[11, 180],
					[12, 100],
					[13, 240],
					[14, 90],
				];
				for (const [i, h] of config) {
					const x = i * 24 + 8;
					const y = (360 - h) / 2;
					const opacity = 0.6 + (i % 3) * 0.13;
					const fill = i % 4 === 0 ? "#689f38" : "#7cb342";
					bars.push(
						`<rect x="${x}" y="${y}" width="14" height="${h}" rx="7" fill="${fill}" opacity="${opacity}" />`,
					);
				}
				return `
					<svg class="og-wave" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="wave-fade" x1="0" y1="0" x2="1" y2="0">
								<stop offset="0%" stop-color="white" stop-opacity="0" />
								<stop offset="20%" stop-color="white" stop-opacity="1" />
								<stop offset="80%" stop-color="white" stop-opacity="1" />
								<stop offset="100%" stop-color="white" stop-opacity="0" />
							</linearGradient>
							<mask id="wave-mask">
								<rect width="360" height="360" fill="url(#wave-fade)" />
							</mask>
						</defs>
						<g mask="url(#wave-mask)">${bars.join("")}</g>
					</svg>
				`;
			}

			function titleSizeClass(text) {
				const len = text.replace(/\*/g, "").length;
				if (len > 80) return "size-sm";
				if (len > 50) return "size-md";
				return "";
			}

			// Convert *highlighted* segments to <em> tags for the brushstroke effect.
			function renderTitle(text) {
				const escaped = escapeHtml(text);
				return escaped.replace(/\*([^*]+)\*/g, "<em>$1</em>");
			}

						<div class="og-body">
							${data.eyebrow ? `<div class="eyebrow">${escapeHtml(data.eyebrow)}</div>` : ""}
							<h2 class="og-title ${sizeClass}">${renderTitle(data.title)}</h2>
							<p class="og-tagline">${escapeHtml(data.tagline)}</p>
						</div>
						<div class="og-footer">
							<span class="left">
								<strong>${escapeHtml(data.footerLeft || "Parrot")}</strong>
							</span>
							<span>Local-first · macOS</span>
						</div>
					</div>
				`;
			}

			function blogTemplate(post) {
				const sizeClass = titleSizeClass(post.title);
				return `
					<div class="og">
						<div class="og-corner-frame"></div>
						${waveformSVG()}
						<div class="og-header">
							${brand()}
						</div>
						<div class="og-body">
							<div class="eyebrow"><span class="eyebrow-dot"></span>The Parrot Blog</div>
							<h2 class="og-title ${sizeClass}">${escapeHtml(post.title)}</h2>
						</div>
						<div class="og-footer">
							<span class="left">
								<strong>Kash Gohil</strong>
								<span class="divider-dot"></span>
								<span>${escapeHtml(post.readingTime)}</span>
							</span>
							<span>tryparrot.app/blog</span>
						</div>
					</div>
				`;
			}

			function escapeHtml(s) {
				return String(s)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/"/g, "&quot;");
			}

			let all = [];

			async function init() {
				await preloadIcon();
				all = [
					...STATIC_PAGES.map((p) => ({
						filename: p.filename,
						html: defaultTemplate(p),
					})),
					...BLOG_POSTS.map((p) => ({
						filename: p.slug,
						html: blogTemplate(p),
					})),
				];

				const container = document.getElementById("templates");
				for (const item of all) {
					const card = document.createElement("div");
					card.className = "template-card";
					card.innerHTML = `
						<div class="template-meta">
							<div class="filename">
								<strong>/og/${item.filename}.png</strong> · 1200×630
							</div>
							<button class="btn" data-filename="${item.filename}">Download PNG</button>
						</div>
						<div class="template-shrink">
							<div class="template-frame" id="frame-${item.filename}">${item.html}</div>
						</div>
					`;
					container.appendChild(card);
				}
			}

			init();

			function waitForImage(img, timeoutMs = 3000) {
				if (img.complete && img.naturalWidth > 0) return Promise.resolve();
				return new Promise((resolve) => {
					const done = () => {
						img.onload = null;
						img.onerror = null;
						clearTimeout(timer);
						resolve();
					};
					const timer = setTimeout(done, timeoutMs);
					img.onload = done;
					img.onerror = done;
				});
			}

			async function renderFrameToBlob(filename) {
				const node = document.getElementById(`frame-${filename}`);
				if (!node) return null;
				await document.fonts.ready;

				const imgs = node.querySelectorAll("img");
				await Promise.all([...imgs].map((img) => waitForImage(img)));

				// Temporarily clear any CSS transforms (the preview shrink scales
				// the frame to 50%; html-to-image would capture that scaled state).
				const prevTransform = node.style.transform;
				const prevOrigin = node.style.transformOrigin;
				node.style.transform = "none";
				node.style.transformOrigin = "top left";
				node.getBoundingClientRect();

				try {
					const dataUrl = await toPng(node, {
						width: 1200,
						height: 630,
						pixelRatio: 2, // 2400×1260 — sharp on retina, still ≤1MB
						cacheBust: false,
						skipFonts: false,
					});
					const res = await fetch(dataUrl);
					return await res.blob();
				} finally {
					node.style.transform = prevTransform;
					node.style.transformOrigin = prevOrigin;
				}
			}

			function triggerDownload(blob, filename) {
				const url = URL.createObjectURL(blob);
				const link = document.createElement("a");
				link.download = filename;
				link.href = url;
				document.body.appendChild(link);
				link.click();
				link.remove();
				setTimeout(() => URL.revokeObjectURL(url), 1000);
			}

			document.addEventListener("click", async (e) => {
				const target = e.target;
				if (
					target instanceof HTMLElement &&
					target.dataset &&
					target.dataset.filename
				) {
					target.disabled = true;
					target.textContent = "Capturing…";
					const t0 = performance.now();
					try {
						const blob = await renderFrameToBlob(target.dataset.filename);
						if (blob) {
							triggerDownload(blob, `${target.dataset.filename}.png`);
						}
						const ms = Math.round(performance.now() - t0);
						console.log(
							`[og-templates] ${target.dataset.filename} captured in ${ms}ms`,
						);
						target.textContent = "Downloaded";
						setTimeout(() => {
							target.textContent = "Download PNG";
							target.disabled = false;
						}, 1500);
					} catch (err) {
						console.error(err);
						target.textContent = "Failed — see console";
						target.disabled = false;
					}
				}
			});

			window.downloadAll = async () => {
				const btn = document.querySelector(".bulk-actions .btn");
				const restoreBtn = btn ? btn.textContent : null;
				if (btn) {
					btn.disabled = true;
				}
				const t0 = performance.now();
				const zip = new JSZip();
				for (let i = 0; i < all.length; i++) {
					const item = all[i];
					if (btn) {
						btn.textContent = `Capturing ${i + 1}/${all.length}…`;
					}
					const ti = performance.now();
					const blob = await renderFrameToBlob(item.filename);
					if (blob) {
						zip.file(`${item.filename}.png`, blob);
					}
					console.log(
						`[og-templates] (${i + 1}/${all.length}) ${item.filename} — ${Math.round(performance.now() - ti)}ms`,
					);
				}
				if (btn) {
					btn.textContent = "Zipping…";
				}
				const zipBlob = await zip.generateAsync({ type: "blob" });
				triggerDownload(zipBlob, "parrot-og-images.zip");
				console.log(
					`[og-templates] all done in ${Math.round((performance.now() - t0) / 1000)}s`,
				);
				if (btn) {
					btn.disabled = false;
					btn.textContent = restoreBtn || "Download all";
				}
			};
		</script>
	</body>
</html>
